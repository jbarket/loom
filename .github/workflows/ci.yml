name: CI

on:
  push:
    branches: [main, 'hat-v*']
  pull_request:
    branches: [main, 'hat-v*']

permissions:
  contents: read

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The embedding runtime is vendored, so nothing upstream will catch a
      # regression in it. embedding-runtime.parity.test.ts runs the real ONNX
      # model against golden vectors; this caches the ~90 MB download so that
      # costs one fetch rather than one per run.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/loom/fastembed
          key: loom-embedding-model-fast-bge-small-en-v1.5-v1

      - name: Test
        run: npm test
